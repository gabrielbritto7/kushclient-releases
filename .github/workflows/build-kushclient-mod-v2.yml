name: Build KushClient Mod v0.2.0

on:
  push:
    branches:
      - build/kushclient-mod-0.2.0
    paths:
      - 'mod-src/**'
      - '.github/workflows/build-kushclient-mod-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25 for build tooling
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build Fabric mod
        shell: bash
        run: |
          cd mod-src
          gradle --no-daemon clean build
          ls -lah build/libs

      - name: Download Fabric API 1.21.1
        shell: bash
        run: |
          curl -fL 'https://cdn.modrinth.com/data/P7dR8mSH/versions/zp7D0pBT/fabric-api-0.116.17%2B1.21.1.jar' -o fabric-api-0.116.17+1.21.1.jar

      - name: Verify JAR
        shell: bash
        run: |
          test -f mod-src/build/libs/KushClient-0.2.0.jar
          unzip -t mod-src/build/libs/KushClient-0.2.0.jar
          unzip -p mod-src/build/libs/KushClient-0.2.0.jar fabric.mod.json | grep -q '"id": "kushclient"'
          sha256sum mod-src/build/libs/KushClient-0.2.0.jar > KushClient-0.2.0.sha256.txt

      - name: Upload KushClient bundle files
        uses: actions/upload-artifact@v4
        with:
          name: KushClient-Mod-1.21.1-v0.2.0-with-fabric-api
          path: |
            mod-src/build/libs/KushClient-0.2.0.jar
            KushClient-0.2.0.sha256.txt
            fabric-api-0.116.17+1.21.1.jar
          if-no-files-found: error
          retention-days: 7
