name: KushMod theme A — native Minecraft screenshots
on:
  push:
    branches: [build/kush-theme-a-1.21.11, build/kush-v036-cosmetics-language, build/kushmod-0.3.10]
    paths: ['kush-theme/**', '.github/workflows/kush-theme-a.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-capture:
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, wavey]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Check image reduction and aspect ratios
        run: |
          mkdir -p /tmp/kush-image-check
          javac -d /tmp/kush-image-check kush-theme/java/net/fastclient/hud/gui/KushImageResampler.java kush-theme/tests/ResamplerCheck.java
          java -Djava.awt.headless=true -cp /tmp/kush-image-check ResamplerCheck
          javac -d /tmp/kush-image-check kush-theme/java/net/fastclient/hud/gui/KushThumbnailFrames.java kush-theme/tests/ThumbnailFramesCheck.java
          java -Djava.awt.headless=true -cp /tmp/kush-image-check ThumbnailFramesCheck
          javac -d /tmp/kush-image-check kush-theme/java/net/fastclient/hud/gui/KushCapeSimulation.java kush-theme/java/net/fastclient/hud/gui/KushCapeCards.java kush-theme/java/net/fastclient/hud/gui/KushRgbBorder.java kush-theme/tests/CapePhysicsCheck.java
          java -Djava.awt.headless=true -cp /tmp/kush-image-check CapePhysicsCheck
      - name: Build native UI
        run: |
          git clone https://github.com/itz0cat/fastclient-hud.git base
          git -C base checkout 5baac88762c0c224c904bdc86fb38dffc9a46e7a
          python3 kush-theme/apply.py
          cd base
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --refresh-dependencies build
      - name: Assemble KushMod while preserving existing modules
        run: python3 kush-theme/assemble.py
      - name: Prepare capture client
        run: |
          mkdir -p capture/src/main/java/dev/kush/capture capture/src/main/resources capture/run/mods
          cp kush-theme/capture/settings.gradle kush-theme/capture/build.gradle capture/
          cp kush-theme/capture/fabric.mod.json capture/src/main/resources/
          cp kush-theme/capture/CaptureDriver.java capture/src/main/java/dev/kush/capture/
          cp kush-theme/capture/options.txt capture/run/
          cp dist/KushMod-1.21.11-v0.3.10.jar capture/run/mods/
          printf '\nlang:en_us\nmenuBackgroundBlurriness:4\n' >> capture/run/options.txt
      - name: Install official Wavey only in test client
        if: matrix.mode == 'wavey'
        run: |
          curl --fail --location 'https://cdn.modrinth.com/data/kYuIpRLv/versions/HiXJOcqr/waveycapes-fabric-1.11.2-mc1.21.11.jar' --output capture/run/mods/waveycapes.jar
          echo '3e6d6d14981492cf909acf5d2d034d8b946bd4b3  capture/run/mods/waveycapes.jar' | sha1sum --check
      - name: Real Minecraft framebuffer captures
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          mkdir -p logs capture/run/kush-captures
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset > logs/xvfb.log 2>&1 &
          XPID=$!
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null
          if [ '${{ matrix.mode }}' = wavey ]; then export KUSH_CAPTURE_WAVEY=1 KUSH_CAPTURE_ACCESSORIES_ONLY=1; fi
          for i in $(seq 1 100); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep .2; done
          set +e
          cd capture
          timeout 600 gradle --no-daemon --max-workers=2 runClient --args='--width 1280 --height 720 --demo' > ../logs/minecraft.log 2>&1
          STATUS=$?
          cd ..
          kill "$XPID" 2>/dev/null || true
          grep '\[KushCapture\]' logs/minecraft.log || true
          if [ "$STATUS" -ne 0 ]; then tail -180 logs/minecraft.log; exit "$STATUS"; fi
          test -f capture/run/kush-captures/01-main-menu.png
          test -f capture/run/kush-captures/12-hud-in-game.png
          if [ '${{ matrix.mode }}' = wavey ]; then
            test -f capture/run/kush-captures/51-wavey-official-settings.png
            test -f capture/run/kush-captures/55-wavey-pause-white-k.png
          else
            test -f capture/run/kush-captures/31-catalog-page-two.png
            test -f capture/run/kush-captures/36-cape-physics-settings-pt.png
          fi
      - name: JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KushMod-1.21.11-v0.3.10-${{ matrix.mode }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 90
      - name: Native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KushMod-v0.3.10-native-screenshots-${{ matrix.mode }}
          path: capture/run/kush-captures/*.png
          if-no-files-found: warn
          retention-days: 90
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KushMod-v0.3.10-test-logs-${{ matrix.mode }}
          path: logs/*
          if-no-files-found: warn
          retention-days: 14

